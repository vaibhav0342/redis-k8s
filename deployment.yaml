```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-test-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: redis-test-app

  template:
    metadata:
      labels:
        app: redis-test-app

    spec:
      containers:
        - name: app
          image: your-app-image:latest

          env:
            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

          ports:
            - containerPort: 8080
```
